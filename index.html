<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Valentina Confecciones | Enlaces Oficiales</title>
  <meta name="theme-color" content="#09090c" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #09090c;
      --magenta: #e91e63;
      --cyan: #00bcd4;
      --text-main: #ffffff;
      --text-muted: #d6dae4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 10px 20px;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 18% 22%, rgba(233, 30, 99, 0.15), transparent 45%),
        radial-gradient(circle at 82% 78%, rgba(0, 188, 212, 0.14), transparent 45%),
        repeating-linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.014) 0px,
          rgba(255, 255, 255, 0.014) 2px,
          transparent 2px,
          transparent 6px
        ),
        repeating-linear-gradient(
          -45deg,
          rgba(255, 255, 255, 0.014) 0px,
          rgba(255, 255, 255, 0.014) 2px,
          transparent 2px,
          transparent 6px
        );
    }

    .jersey-stage {
      position: relative;
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .jersey-bg-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .jersey-base-img {
      width: 100%;
      height: auto;
      max-height: 94dvh;
      object-fit: contain;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .jersey-print-area {
      position: absolute;
      top: 19.5%;
      bottom: 7.5%;
      width: 46%;
      max-width: 290px;
      min-width: 185px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      z-index: 20;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .brand-logo {
      width: 134px;
      max-width: 88%;
      height: auto;
      object-fit: contain;
    }

    .stitch-divider {
      width: 74%;
      border: none;
      border-top: 1.5px dashed rgba(255, 255, 255, 0.24);
      margin: 2px 0;
    }

    .patches-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    /* Parche / Estampado textil semi-integrado sobre la tela */
    .patch-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 7px 11px;
      text-decoration: none;
      color: var(--text-main);
      opacity: 1;
      background:
        repeating-linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.018) 0px,
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px,
          transparent 4px
        ),
        linear-gradient(155deg, rgba(22, 23, 29, 0.86), rgba(10, 11, 15, 0.94));
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow:
        0 5px 12px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        inset 0 -1px 2px rgba(0, 0, 0, 0.65);
      transition: transform 0.18s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      overflow: hidden;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
    }

    /* Pespunte / costura perimetral del parche */
    .patch-btn::before {
      content: "";
      position: absolute;
      inset: 2.5px;
      border-radius: 9px;
      border: 1px dashed rgba(255, 255, 255, 0.26);
      pointer-events: none;
      transition: border-color 0.2s ease;
    }

    /* Pequeño acento lateral tipo etiqueta cosida */
    .patch-btn::after {
      content: "";
      position: absolute;
      left: 0;
      top: 20%;
      bottom: 20%;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--accent-color, var(--magenta));
      opacity: 0.85;
      transition: opacity 0.2s ease, width 0.2s ease;
    }

    .patch-btn:hover,
    .patch-btn:active {
      transform: translateY(-2px) scale(1.015);
      border-color: rgba(255, 255, 255, 0.38);
      background:
        repeating-linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.025) 0px,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px,
          transparent 4px
        ),
        linear-gradient(155deg, rgba(30, 32, 40, 0.92), rgba(14, 15, 20, 0.96));
      box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.72),
        0 0 14px var(--glow-color, rgba(233, 30, 99, 0.3));
    }

    .patch-btn:hover::before {
      border-color: rgba(255, 255, 255, 0.42);
    }

    .patch-btn:hover::after {
      width: 4px;
      opacity: 1;
    }

    .patch-btn:active {
      transform: scale(0.98);
    }

    .patch-icon {
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--icon-bg, #222);
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.28),
        0 2px 6px rgba(0, 0, 0, 0.55);
      z-index: 1;
    }

    .patch-icon svg {
      width: 16px;
      height: 16px;
      fill: #ffffff;
    }

    .patch-handle {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 1;
    }

    .patch-wa {
      --icon-bg: linear-gradient(135deg, #25d366, #128c7e);
      --accent-color: #25d366;
      --glow-color: rgba(37, 211, 102, 0.32);
    }
    .patch-web {
      --icon-bg: linear-gradient(135deg, #00bcd4, #00838f);
      --accent-color: #00bcd4;
      --glow-color: rgba(0, 188, 212, 0.35);
    }
    .patch-ig {
      --icon-bg: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --accent-color: #e91e63;
      --glow-color: rgba(233, 30, 99, 0.35);
    }
    .patch-tt {
      --icon-bg: linear-gradient(135deg, #161823, #2b2f3a);
      --accent-color: #00f2ea;
      --glow-color: rgba(0, 242, 234, 0.28);
    }
    .patch-yt {
      --icon-bg: linear-gradient(135deg, #ff1744, #b71c1c);
      --accent-color: #ff1744;
      --glow-color: rgba(255, 23, 68, 0.32);
    }
    .patch-map {
      --icon-bg: linear-gradient(135deg, #00c853, #00796b);
      --accent-color: #00e676;
      --glow-color: rgba(0, 230, 118, 0.32);
    }

    .woven-tag-link {
      margin-top: 4px;
      padding: 4px 10px;
      background: rgba(12, 12, 16, 0.9);
      border: 1px dashed rgba(255, 255, 255, 0.24);
      border-radius: 6px;
      font-size: 0.56rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.72);
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      opacity: 1;
      transition: border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, transform 0.18s ease;
    }

    .woven-tag-link span {
      color: #ffffff;
      font-weight: 800;
    }

    .woven-tag-link svg {
      width: 11px;
      height: 11px;
      fill: #00f2ea;
      flex-shrink: 0;
    }

    .woven-tag-link:hover,
    .woven-tag-link:active {
      border-color: rgba(0, 242, 234, 0.65);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 0 12px rgba(0, 242, 234, 0.25);
    }

    @media (max-width: 540px) {
      .jersey-print-area {
        top: 23.5%;
        bottom: 7.5%;
        width: 52%;
        min-width: 190px;
        gap: 5px;
      }
      .brand-logo {
        width: 88px;
      }
      .stitch-divider {
        margin: 1px 0;
      }
      .patches-list {
        gap: 5px;
      }
      .patch-btn {
        padding: 5px 8px;
        gap: 7px;
        border-radius: 10px;
      }
      .patch-btn::before {
        inset: 2px;
        border-radius: 8px;
      }
      .patch-icon {
        width: 22px;
        height: 22px;
        min-width: 22px;
        border-radius: 6px;
      }
      .patch-icon svg {
        width: 13px;
        height: 13px;
      }
      .patch-handle {
        font-size: 0.56rem;
      }
      .woven-tag-link {
        margin-top: 3px;
        padding: 3px 8px;
        font-size: 0.48rem;
      }
    }
  </style>
</head>
